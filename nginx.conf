server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Optional password protection (see README): uncomment both lines
  # auth_basic "BatchLab";
  # auth_basic_user_file /etc/nginx/.htpasswd;

  # always load the newest index.html, cache the libraries
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /vendor/ { add_header Cache-Control "public, max-age=2592000"; }
  location / { try_files $uri /index.html; }

  client_max_body_size 200m;
  gzip on;
  gzip_types text/html application/javascript text/css;
}
