<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BatchLab, Nesting &amp; Production Layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEEE9; --panel:#F8F9F6; --ink:#1C2024; --muted:#5D6863; --line:#D3D8D2; --field:#FFFFFF;
  --mat:#2E5446; --grid:#3A6656; --grid-major:#4F7E6B; --mat-ink:#D5E6DC;
  --sheet:#FFFFFF; --cut:#E4007C; --accent:#2E5446; --accent-ink:#FFFFFF; --warn:#B4441B; --sel:#1E7FD8;
  --sans:"Archivo", "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151918; --panel:#1C2120; --ink:#E4E8E3; --muted:#98A39D; --line:#2F3634; --field:#121615;
    --mat:#1F3A30; --grid:#2A4A3E; --grid-major:#3A5F51; --mat-ink:#BFD6C9;
    --sheet:#F4F4F0; --accent:#6FAE92; --accent-ink:#0F1A15; --warn:#F08A5D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151918; --panel:#1C2120; --ink:#E4E8E3; --muted:#98A39D; --line:#2F3634; --field:#121615;
  --mat:#1F3A30; --grid:#2A4A3E; --grid-major:#3A5F51; --mat-ink:#BFD6C9;
  --sheet:#F4F4F0; --accent:#6FAE92; --accent-ink:#0F1A15; --warn:#F08A5D; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; background:var(--paper); color:var(--ink); font:14px/1.45 var(--sans); display:flex; flex-direction:column}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--cut); outline-offset:2px}
[hidden]{display:none !important}

.top{display:flex; align-items:center; gap:20px; padding:10px 18px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto}
.brand h1{font-size:17px; font-weight:650; font-stretch:85%; margin:0}
.ver{font-size:11.5px; color:var(--muted); border:1px solid var(--line); border-radius:10px; padding:1px 8px; font-variant-numeric:tabular-nums}
.stats{display:flex; gap:22px; flex-wrap:wrap}
.stat{display:flex; flex-direction:column; line-height:1.15}
.stat b{font-size:18px; font-weight:650; font-stretch:80%; font-variant-numeric:tabular-nums}
.stat span{font-size:12px; color:var(--muted)}
.actions{display:flex; gap:8px; flex-wrap:wrap}
.btn{border:1px solid var(--line); background:var(--field); padding:8px 13px; border-radius:6px; cursor:pointer; font-weight:550; white-space:nowrap; display:inline-flex; align-items:center; gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5; cursor:progress}
.btn.small{padding:5px 9px; font-size:13px}
/* compact panel */
details.sec{padding:0; border-bottom:1px solid var(--line)}
details.sec > summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; padding:12px 16px 12px 13px; user-select:none; background:color-mix(in srgb, var(--accent) 15%, var(--panel)); border-left:3px solid var(--accent)}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary::before{content:""; width:7px; height:7px; border-right:1.6px solid var(--muted); border-bottom:1.6px solid var(--muted); transform:rotate(-45deg); transition:transform .15s; flex:0 0 auto; margin-right:2px}
details.sec[open] > summary::before{transform:rotate(45deg)}
details.sec > summary h2{margin:0; font-size:14px; font-weight:700; letter-spacing:.01em}
details.sec > summary .sum{color:var(--ink) !important; opacity:.7}
details.sec[open] > summary{background:color-mix(in srgb, var(--accent) 20%, var(--panel)); margin-bottom:12px}
details.sec > summary .sum{margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60%}
details.sec[open] > summary .sum{display:none}
details.sec > summary:hover{background:color-mix(in srgb, var(--accent) 26%, var(--panel))}
details.sec > summary::before{border-color:var(--accent) !important}
.side > section.sec > h2{background:color-mix(in srgb, var(--accent) 20%, var(--panel)); border-left:3px solid var(--accent); margin:-14px -18px 12px; padding:10px 18px 10px 15px; font-size:14px; font-weight:700}
details.sec > :not(summary){margin-left:16px; margin-right:16px}
details.sec > :last-child{margin-bottom:14px}
.row.tight{gap:8px; margin-bottom:8px; align-items:flex-end; flex-wrap:nowrap}
.f{display:flex; flex-direction:column; gap:2px; font-size:11px; color:var(--muted); min-width:0}
.f > span{white-space:nowrap; display:flex; align-items:center; gap:4px}
.f input,.f select,.sel{background:var(--field); border:1px solid var(--line); border-radius:5px; padding:4px 6px; font-size:13px; color:var(--ink); width:62px; height:29px; font-variant-numeric:tabular-nums}
.f select,.sel{width:100%; padding:3px 4px}
.f:not(.grow) select{width:84px}
.f.grow{flex:1}
.f.grow input{width:100%}
.grow{flex:1; min-width:0}
.inl{display:flex; gap:6px; align-items:flex-end}
.inl[hidden]{display:none !important}
.vsep{width:1px; align-self:stretch; background:var(--line); margin:0 2px}
.seg.sm{margin:0; flex:0 0 auto}
.seg.sm button{padding:6px 14px; font-size:14px; font-weight:600; height:36px}
#material{height:36px; font-size:14px}
.iconbtn.sm{width:26px; height:29px}
.check.inline{margin:0 0 6px; white-space:nowrap; font-size:13px}
.btn.wide{width:100%; justify-content:center; margin-top:2px}
details.sub{border:1px solid var(--line); border-radius:6px; margin-top:10px}
details.sub > summary{list-style:none; cursor:pointer; padding:7px 10px; font-size:12.5px; font-weight:600; display:flex; gap:8px; align-items:center}
details.sub > summary::-webkit-details-marker{display:none}
details.sub > summary::before{content:"+"; color:var(--accent); font-weight:700; width:10px}
details.sub[open] > summary::before{content:"\2013"}
details.sub > summary .sum{margin-left:auto; font-weight:400; color:var(--muted); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
details.sub[open] > summary .sum{display:none}
details.sub > .row, details.sub > div > .row{padding:0 10px}
.using{font-style:normal; color:var(--accent); font-weight:600}
.info{display:inline-grid; place-items:center; width:14px; height:14px; border-radius:50%; border:1px solid currentColor; font:italic 600 9.5px/1 Georgia, serif; color:var(--muted); cursor:help; flex:0 0 auto}
.info:hover,.info:focus-visible{color:var(--accent)}
.tip{position:fixed; z-index:20; max-width:260px; background:var(--ink); color:var(--paper); font-size:12px; line-height:1.4; padding:7px 9px; border-radius:6px; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.18)}
.side .btn[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}

.app{flex:1; min-height:0; display:grid; grid-template-columns:400px 1fr}
.side{overflow:auto; border-right:1px solid var(--line); background:var(--panel)}
.sec{padding:14px 18px 16px; border-bottom:1px solid var(--line)}
.sec h2{font-size:14px; font-weight:650; margin:0 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px}
.row{display:flex; gap:10px; align-items:flex-end; margin-bottom:10px; flex-wrap:wrap}
.row:last-child{margin-bottom:0}
.fld{display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); flex:1; min-width:70px}
.fld input,.fld select{background:var(--field); border:1px solid var(--line); border-radius:5px; padding:6px 8px; font-size:14px; color:var(--ink); width:100%; font-variant-numeric:tabular-nums}
.fld input:hover,.fld select:hover{border-color:var(--muted)}
.check{display:flex; gap:8px; align-items:center; font-size:13.5px; cursor:pointer; margin:0 0 7px}
.check input{accent-color:var(--accent); width:16px; height:16px; margin:0; flex:0 0 auto}
.hint{font-size:12px; color:var(--muted); margin:6px 0 0}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-bottom:12px}
.seg button{border:0; background:var(--field); padding:6px 16px; cursor:pointer; font-weight:550}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.iconbtn{border:1px solid var(--line); background:var(--field); border-radius:5px; width:32px; height:32px; display:grid; place-items:center; cursor:pointer; flex:0 0 auto}
.iconbtn:hover{border-color:var(--muted)}
.cutswatch{display:inline-block; width:18px; height:0; border-top:2px solid var(--cut); vertical-align:middle; margin-right:2px}
.subhead{font-size:12.5px; font-weight:650; margin:14px 0 8px; color:var(--ink)}
.using{font-size:12px; color:var(--accent); font-weight:600}

.jobs{list-style:none; margin:0; padding:0}
.job{display:grid; grid-template-columns:52px 1fr 26px; gap:10px; padding:10px 0; border-top:1px solid var(--line)}
.job:first-child{border-top:0}
.thumb{width:52px; height:52px; object-fit:contain; background:repeating-conic-gradient(#e3e6e1 0 25%, #fff 0 50%) 0 0/10px 10px; border:1px solid var(--line); border-radius:4px}
.thumb.sm{width:40px; height:40px}
.thumb.noback{display:grid; place-items:center; color:var(--muted); font-size:11px; background:var(--field)}
.job-name{width:100%; border:1px solid transparent; background:transparent; padding:2px 4px; margin:-2px -4px 4px; border-radius:4px; font-weight:600}
.job-name:hover,.job-name:focus{border-color:var(--line); background:var(--field)}
.job-size{display:grid; grid-template-columns:68px 22px 68px 52px; gap:6px; align-items:end}
.job-size .fld{min-width:0}
.job-size .fld input{padding:4px 6px; font-size:13.5px}
.lock{height:29px; width:26px; border:0; background:none; cursor:pointer; color:var(--muted); display:grid; place-items:center; padding:0}
.lock[aria-pressed="true"]{color:var(--accent)}
.job-opts{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:7px; font-size:12.5px}
.job-opts .check{margin:0; font-size:12.5px}
.job-meta{color:var(--muted); font-size:12px; margin-top:4px}
.placed{margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums}
.placed.bad{color:var(--warn); font-weight:600}
.lowres{color:var(--warn)}
.fcut{color:var(--cut); font-weight:600}
.remove{border:0; background:none; cursor:pointer; color:var(--muted); font-size:20px; line-height:1; height:26px; border-radius:4px}
.remove:hover{color:var(--warn); background:var(--paper)}
.back-row{display:grid; grid-template-columns:40px 1fr; gap:8px; margin-top:8px; padding:8px; background:var(--paper); border-radius:6px; font-size:12.5px}
.back-row .bname{font-weight:600; word-break:break-all}
.back-row .bname.none{color:var(--warn); font-weight:550}
.back-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:5px; align-items:center}
.back-actions select{font-size:12.5px; padding:4px 6px; border:1px solid var(--line); border-radius:5px; background:var(--field); max-width:190px}
.dropzone{border:1.5px dashed var(--line); border-radius:8px; padding:14px; text-align:center; color:var(--muted); font-size:13px; cursor:pointer; margin-bottom:10px}
.dropzone:hover{border-color:var(--accent); color:var(--ink)}

.mat{overflow:auto; position:relative;
  background-color:var(--mat);
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  background-attachment:local;
}
.matbar{position:sticky; top:0; z-index:3; display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:9px 26px; background:rgba(14,30,24,.86); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); color:var(--mat-ink); font-size:13px; min-height:48px}
.matbar .seg{margin:0; border-color:rgba(255,255,255,.25)}
.matbar .seg button{padding:4px 14px; font-size:13px; color:var(--ink)}
.matbar .seg button[aria-pressed="true"]{color:var(--accent-ink)}
.matbar .btn{background:transparent; color:#fff; border-color:rgba(255,255,255,.35)}
.matbar .btn[aria-pressed="true"]{background:#fff; color:#1C2024; border-color:#fff}
.edit-hint{flex-basis:100%; font-size:12.5px; line-height:1.4}
.selbox{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.08); padding:3px 4px 3px 10px; border-radius:6px}
.selbox input{width:72px; padding:3px 6px; border-radius:4px; border:1px solid rgba(255,255,255,.35); background:#fff; color:#1C2024; font-variant-numeric:tabular-nums}
.selbox input:disabled{opacity:.55}
.fig.editing.tool-add [data-media]{cursor:copy}
.fig.editing.tool-move [data-media]{cursor:default}
.fig.editing.tool-remove [data-media]{cursor:default}
.fig.editing.tool-remove [data-mk]{cursor:pointer}
.matbody{padding:18px 26px 40px}
.mat.drag::after{content:"Drop files to add jobs"; position:absolute; inset:12px; border:2px dashed var(--mat-ink); border-radius:12px; display:grid; place-items:center; color:var(--mat-ink); font-size:20px; font-weight:600; background:rgba(20,40,32,.55); pointer-events:none; z-index:5}
.warns{margin:0 0 14px; display:flex; flex-direction:column; gap:6px}
.warn{background:#FFF3EC; color:#7A2A0C; border-left:3px solid #D9541E; padding:7px 10px; border-radius:4px; font-size:13px; max-width:780px}
.fig{margin:0 0 30px}
.fig figcaption{color:var(--mat-ink); font-size:13px; display:flex; gap:16px; margin:0 0 8px 22px; flex-wrap:wrap}
.fig figcaption b{color:#fff; font-weight:650}
.fig svg{display:block; overflow:visible; touch-action:none}
.fig.editing [data-mk]{cursor:grab}
.empty{max-width:460px; margin:10vh auto 0; text-align:center; color:var(--mat-ink)}
.empty h2{color:#fff; font-size:26px; font-weight:650; font-stretch:85%; margin:0 0 8px; line-height:1.15}
.empty p{margin:0 0 20px}
.empty .actions{justify-content:center}
.empty .btn{background:#fff; color:#1C2024; border-color:#fff}
.empty .btn.ghost{background:transparent; color:#fff; border-color:var(--mat-ink)}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:9px 14px; border-radius:6px; font-size:13.5px; max-width:90vw; opacity:0; transition:opacity .2s; pointer-events:none; z-index:50}
.hist-ov{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; display:grid; place-items:center}
.hist{width:min(1040px,94vw); height:min(88vh,920px); background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.4)}
.hist-head{display:flex; gap:10px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.hist-head b{font-size:16px}
.hist-q{flex:1; min-width:180px; background:var(--field); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:7px 10px; font-size:14px}
.hist-use{font-size:12px; color:var(--muted)}
.hist-list{overflow:auto; padding:4px 16px 16px; flex:1}
.hrow{display:grid; grid-template-columns:200px 1fr auto; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); align-items:center}
.hrow img{width:200px; display:block; background:#fff; border:1px solid var(--line); border-radius:4px; cursor:zoom-in}
.hmeta{font-size:13px; color:var(--muted); line-height:1.5; min-width:0}
.hmeta b{color:var(--ink); font-size:14px; display:block; word-break:break-all}
.hbtns{display:flex; flex-direction:column; gap:6px}
.hgal figure{margin:0 0 18px}
.hgal img{width:100%; display:block; background:#fff; border:1px solid var(--line)}
.hgal figcaption{font-size:13px; color:var(--muted); margin-top:4px}
.hist-empty{color:var(--muted); padding:40px 0; text-align:center}
.toast.show{opacity:1}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

@media (max-width: 880px){
  body{height:auto; display:block}
  .app{display:block}
  .side{border-right:0; overflow:visible}
  .mat{min-height:75vh}
  .stats{gap:16px; width:100%}
}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 1v24M1 13h24" stroke="currentColor" stroke-width="1.6"/></svg>
    <h1>Nesting &amp; production layout</h1>
    <span class="ver" id="appVer" title="Version of the tool you're running"></span>
  </div>
  <div class="stats" id="stats" aria-live="polite"></div>
  <div class="actions">
    <button class="btn" id="btnHist" title="Past batches: cut files and sheet screenshots">History</button>
    <button class="btn" id="btnCsv">Layout report (CSV)</button>
    <button class="btn" id="btnCut">Export cut-only PDF</button>
    <button class="btn primary" id="btnPdf">Export print files</button>
  </div>
</header>

<div class="app">
  <aside class="side">
    <details class="sec" data-k="media" open>
      <summary><h2>Media &amp; spacing</h2><span class="sum" id="sumMedia"></span></summary>
      <div class="row tight">
        <div class="seg sm" role="group" aria-label="Media type">
          <button id="modeSheet" aria-pressed="true">Sheet</button>
          <button id="modeRoll" aria-pressed="false">Roll</button>
          <button id="modeBanner" aria-pressed="false">Banner</button>
        </div>
        <label class="f grow" id="bannerMatWrap" hidden><span>Material</span>
          <select id="bannerMat">
            <option value="13oz">13oz vinyl</option>
            <option value="15oz">15oz vinyl</option>
            <option value="18oz">18oz blockout</option>
            <option value="mesh">Mesh</option>
            <option value="fabric">Fabric</option>
          </select>
        </label>
        <label class="f grow" id="materialWrap"><span>Material</span>
          <select id="material">
            <option value="">Choose material</option>
            <option value="foam">Foam board</option>
            <option value="coroplast">Coroplast</option>
            <option value="pvc">PVC</option>
            <option value="dibond">Dibond</option>
            <option value="pulpboard">Pulpboard</option>
            <option value="gatorboard">Gatorboard</option>
            <option value="acrylic">Acrylic</option>
            <option value="eflute">E-flute</option>
            <option value="other">Other…</option>
          </select>
        </label>
      </div>
      <div class="row tight" id="materialOtherRow" hidden>
        <label class="f grow"><span>Material name</span><input type="text" id="materialOther" placeholder="e.g. Sintra 6 mm"></label>
      </div>
      <div class="row tight">
        <span id="sheetPresetWrap" class="grow">
          <select id="sheetPreset" class="sel" aria-label="Sheet size">
            <option value="96x48">48 × 96 in</option>
            <option value="96.25x48.25">48.25 × 96.25 in</option>
            <option value="120x48">48 × 120 in</option>
            <option value="120x60">60 × 120 in</option>
            <option value="96x60">60 × 96 in</option>
            <option value="48x36">36 × 48 in</option>
            <option value="36x24">24 × 36 in</option>
            <option value="custom">Custom</option>
          </select>
        </span>
        <span id="bannerPresetWrap" class="grow" hidden>
          <select id="bannerPreset" class="sel" aria-label="Banner size">
            <option value="impose">Impose only (file size)</option>
            <option value="38">38 in roll</option><option value="48">48 in roll</option><option value="54">54 in roll</option>
            <option value="63">63 in roll</option><option value="126">126 in roll</option><option value="custom">Custom</option>
          </select>
        </span>
        <span id="rollPresetWrap" class="grow" hidden>
          <select id="rollPreset" class="sel" aria-label="Roll width">
            <option value="24">24 in roll</option><option value="30">30 in roll</option><option value="36">36 in roll</option>
            <option value="38">38 in roll</option><option value="50">50 in roll</option><option value="54">54 in roll</option>
            <option value="60">60 in roll</option><option value="63">63 in roll</option><option value="64">64 in roll</option>
            <option value="72">72 in roll</option><option value="98">98 in roll</option><option value="126">126 in roll</option>
            <option value="custom">Custom</option>
          </select>
        </span>
        <label class="f" id="thickWrap">
          <select id="thickness" style="width:104px" aria-label="Board thickness">
            <option value="">Thickness</option>
          </select>
        </label>
      </div>
      <div class="row tight">
        <span id="sheetFields" class="inl">
          <label class="f"><span>Width</span><input type="number" id="sheetW" min="1" step="0.125"></label>

<script>

const $ = s => document.querySelector(s);
const EPS = 1e-6;
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js";

const DEFAULTS = { mode:"sheet", sheetW:96, sheetH:48, rollW:54, rollMax:0, margin:0.1, gap:0, rotate:true,

  cutter:"colex", spotName:"CutContour", markShape:"circle", markSize:0.25, markQty:6, markDist:0.1, dirCorner:"bl", dirSpacing:2,

};

/* ================= artwork loading ================= */
async function loadAny(f){
  const base = f.name.replace(/\.[^.]+$/, "");
  const ext = (f.name.split(".").pop() || "").toLowerCase();
  if (ext === "pdf" || f.type === "application/pdf") return loadPdf(f, base);
  if (ext === "svg" || f.type === "image/svg+xml") return loadSvg(f, base);
  if ((f.type || "").startsWith("image/") || ["png","jpg","jpeg","webp","gif"].includes(ext)) return loadRaster(f, base, ext);
  throw new Error("unsupported type. Use PDF, SVG, PNG or JPG");
}

const CUT_SPOT_NAMES = ["cut", "cutcontour", "contourcut", "thrucut", "throughcut", "kisscut", "diecut", "die", "dieline", "dielines",

async function pdfCutOnly(a){

    const arr = src.context.lookup(v);
    if (arr instanceof PDFArray && arr.size() >= 2 && arr.get(0).asString && arr.get(0).asString() === "/Separation" && isCutSpot(pdfNameStr(arr.get(1)))) cutRes.add(k.asString().slice(1));

  if (res instanceof PDFDict) for (const k of ["XObject", "Font", "Shading", "Pattern", "Properties"]) res.delete(PDFName.of(k));

  if (state.renameFileCut) walkSeparations(src.context, res, (arr, name) => { if (isCutSpot(name)) arr.set(1, PDFName.of(target)); });

async function loadPdf(f, base){
  if (!window.pdfjsLib) throw new Error("the PDF reader didn't load; check your connection and reload");
  const bytes = new Uint8Array(await f.arrayBuffer());
  const pdf = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
  const n = Math.min(pdf.numPages, 50), out = [];
  let src = null;
  try { if (window.PDFLib) src = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption:true, updateMetadata:false }); } catch (e) { console.warn("cut-line scan skipped", e); }
  if (pdf.numPages > 50) toast(`${f.name}: only the first 50 pages were added.`);
  for (let i = 1; i <= n; i++) {
    const page = await pdf.getPage(i);
    const vp1 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: 600 / Math.max(vp1.width, vp1.height) });
    const c = document.createElement("canvas");
    c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    const w = vp1.width / 72, h = vp1.height / 72;
    out.push({ name: n > 1 ? `${base} p${i}` : base, srcName: n > 1 ? `${base} p${i}` : base, type:"pdf", w, h, natW:w, natH:h,
      thumb: c.toDataURL("image/png"), pdfBytes: bytes, pageIndex: i - 1, pageRot: ((page.rotate || 0) % 360 + 360) % 360, pageCount: pdf.numPages });
    const fc = src ? detectFileCut(src, i - 1) : [];
    if (fc.length) { out[out.length - 1].fileCut = fc; out[out.length - 1].cut = false; }
  }
  const withCut = out.filter(a => a.fileCut).length;
  if (withCut) toast(`${f.name}: found a cut line in the file (${[...new Set(out.flatMap(a => a.fileCut || []))].join(", ")}). It will be used instead of a rectangle.`);
  return out;
}
function svgLen(v){

  const m = String(v).trim().match(/^([\d.]+)\s*(in|mm|cm|pt|pc|px)?$/i);
  if (!m) return null;
  const n = parseFloat(m[1]); const u = (m[2] || "px").toLowerCase();
  return { in:n, mm:n/25.4, cm:n/2.54, pt:n/72, pc:n/6, px:n/96 }[u];
}
async function loadSvg(f, base){

  const hasVB = vb.length === 4 && vb.every(isFinite) && vb[2] > 0 && vb[3] > 0;

async function svgToCanvas(src, wIn, hIn, ppi){

function setSymbol(id, href){
  let im = document.getElementById(id);
  if (!im) {
    im = document.createElementNS("http://www.w3.org/2000/svg", "image");
    im.setAttribute("id", id); im.setAttribute("width", 1); im.setAttribute("height", 1); im.setAttribute("preserveAspectRatio", "none");
    $("#defs").appendChild(im);
  }
  im.setAttribute("href", href);
}
function addJob(art, extra){
  const j = Object.assign({ id:"j" + (++jid), qty:1, rotate:true, cut:true, lock:true, ds:false, back:null }, art, extra || {});
  delete j.pageCount;
  j.aspect = j.w / j.h;
  jobs.push(j);
  setSymbol("img-" + j.id, j.thumb);

async function sampleArt(name, w, h, col, tag){

}

function consistentPack(pieces, W, H, roll, obst){

  add: "Click anywhere on the sheet to add a dot. Click an existing dot to select it.",
  remove: "Click a dot to remove it. Removing the corner dot that carries the direction mark removes both."
};
function selectedMark(){
  if (!selMark || !layout) return null;
  const sh = layout.sheets.find(s => s.sig === selMark.sig); if (!sh) return null;
  const m = marksFor(sh).find(p => p.id === selMark.id);
  return m ? { sh, m } : null;
}
function renderSelBox(){
  const sel = unlocked && side === "front" ? selectedMark() : null;
  $("#selBox").hidden = !sel;
  if (!sel) return;
  const { m } = sel, x = $("#selX"), y = $("#selY");
  if (document.activeElement !== x) x.value = fmt(m.x);
  if (document.activeElement !== y) y.value = fmt(m.y);
  x.disabled = y.disabled = !!m.dirOf;
  $("#selDir").hidden = !!m.dirOf || marksFor(sel.sh).some(p => p.dirOf === m.id);
  $("#selLabel").textContent = m.dirOf ? "Direction dot (linked)" : "Selected dot";
}
function renderMatbar(){
  const anyDS = !!(layout && layout.sheets.some(sh => sh.ds));
  if (!anyDS && side === "back") side = "front";
  $("#sideSeg").hidden = !anyDS;
  document.querySelectorAll("#sideSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.side === side));
  const show = marksOn() && jobs.length > 0;
  const lockIcon = open => open
    ? '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 4.9-.7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
  for (const id of ["#lockBtn", "#lockSide"]) {
    const lb = $(id);
    lb.hidden = id === "#lockBtn" ? !show : !marksOn();
    lb.disabled = !show;
    lb.setAttribute("aria-pressed", unlocked);
    lb.innerHTML = lockIcon(unlocked) + (unlocked ? " Editing marks: click to lock" : " Marks locked: click to unlock");
  }
  const editing = unlocked && side === "front" && show;
  $("#toolSeg").hidden = !editing;
  document.querySelectorAll("#toolSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tool === editMode));
  const anyEdited = !!(layout && layout.sheets.some(sh => overrides.has(sh.sig)));
  $("#resetMarks").hidden = !anyEdited || !marksOn();
  $("#editHint").hidden = !editing;
  $("#editHint").textContent = TOOL_HINTS[editMode];
  renderSelBox();
  $("#sideNote").textContent = side === "back"
    ? `Back view, ${state.flip === "h" ? "flipped left to right" : "flipped top to bottom"}${state.backNudgeX || state.backNudgeY ? `, nudged ${fmt(state.backNudgeX)} / ${fmt(state.backNudgeY)} in` : ""}.${unlocked ? " Switch to Front to edit marks." : ""}`
    : "";
  const mu = $("#modeUsing");
  mu.textContent = marksOn() && state.markMode === "auto" && layout && layout.sheets.length ? `→ ${layout.mode === "free" ? "empty spaces" : "around art"}` : "";
}
function update(){
  const prevEdited = layout ? layout.sheets.filter(sh => overrides.has(sh.sig)).map(sh => sh.sig) : [];
  layout = computeLayout();
  const lost = prevEdited.filter(sig => !layout.sheets.some(sh => sh.sig === sig));
  if (lost.length) { lost.forEach(sig => overrides.delete(sig)); toast("The layout changed, so hand-edited marks went back to automatic."); }
  if (selMark && !layout.sheets.some(sh => sh.sig === selMark.sig)) selMark = null;
  renderLayout(); renderStats(); renderWarnings(); renderMatbar(); updatePlaced();
}

/* ================= mark editing ================= */
let editMode = "move";
function svgPt(svg, e){
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  const r = p.matrixTransform(svg.getScreenCTM().inverse()); return { x:r.x, y:r.y };
}
const snap = v => Math.round(v * 16) / 16;
function ensureOverride(sh){
  if (!overrides.has(sh.sig)) overrides.set(sh.sig, (sh.autoMarks || []).map(p => Object.assign({}, p)));
  return overrides.get(sh.sig);
}
function placeDir(pts, d, vx, vy){
  const P = pts.find(p => p.id === d.dirOf); if (!P) return;
  const D = state.dirSpacing;
  if (Math.abs(vx) >= Math.abs(vy)) { d.x = P.x + Math.sign(vx || 1) * D; d.y = P.y; }
  else { d.x = P.x; d.y = P.y + Math.sign(vy) * D; }
}
function moveMark(pts, m, nx, ny){
  if (m.dirOf) { const P = pts.find(p => p.id === m.dirOf); if (P) placeDir(pts, m, nx - P.x, ny - P.y); return; }
  const dx = nx - m.x, dy = ny - m.y;
  m.x = nx; m.y = ny;
  for (const c of pts) if (c.dirOf === m.id) { c.x += dx; c.y += dy; }
}
function removeMark(sh, id){
  const pts = ensureOverride(sh);
  overrides.set(sh.sig, pts.filter(p => p.id !== id && p.dirOf !== id));
  if (selMark && selMark.id === id) selMark = null;
}
function afterEdit(i){ renderFig(i); renderWarnings(); renderMatbar(); }
function nearestMark(sh, p0, s){
  let near = null, nd = Infinity;
  for (const q of marksFor(sh)) { const d = Math.hypot(q.x - p0.x, q.y - p0.y) * s; if (d < nd) { nd = d; near = q; } }
  return nd <= 14 ? near : null;
}
const sheetsEl = $("#sheets");
sheetsEl.addEventListener("pointerdown", e => {
  grabbed = false;
  if (!unlocked || side !== "front" || !layout || e.button > 0) return;
  const fig = e.target.closest("figure.fig"); if (!fig) return;
  const svg = fig.querySelector("svg"), i = +fig.dataset.i, sh = layout.sheets[i], s = sheetScale(sh), p0 = svgPt(svg, e);
  const near = nearestMark(sh, p0, s);
  if (!near) return;
  e.preventDefault(); grabbed = true;
  if (editMode === "remove") { removeMark(sh, near.id); afterEdit(i); return; }
  const pts = ensureOverride(sh);
  const m = pts.find(p => p.id === near.id); if (!m) return;
  selMark = { sig:sh.sig, id:m.id };
  drag = { i, sh, m, svg, start:p0, ox:m.x, oy:m.y, s, moved:false };
  try { svg.setPointerCapture(e.pointerId); } catch (err) {}
  svg.querySelector("[data-marks]").innerHTML = marksSVG(sh, s, pts, true);
  renderSelBox();
});
sheetsEl.addEventListener("pointermove", e => {
  if (!drag) return;
  const p = svgPt(drag.svg, e), dx = p.x - drag.start.x, dy = p.y - drag.start.y;
  if (!drag.moved && Math.hypot(dx, dy) * drag.s < 3) return;
  drag.moved = true;
  const pts = overrides.get(drag.sh.sig);
  moveMark(pts, drag.m, snap(drag.ox + dx), snap(drag.oy + dy));
  drag.svg.querySelector("[data-marks]").innerHTML = marksSVG(drag.sh, drag.s, pts, true);
  renderSelBox();
});
function endDrag(){
  if (!drag) return;
  const i = drag.i; drag = null;
  afterEdit(i);
}
sheetsEl.addEventListener("pointerup", endDrag);
sheetsEl.addEventListener("pointercancel", endDrag);
sheetsEl.addEventListener("click", e => {
  const act = e.target.closest("[data-act]");
  if (act) { if (act.dataset.act === "add") $("#fileIn").click(); if (act.dataset.act === "sample") addSamples(); return; }
  if (grabbed) { grabbed = false; return; }
  if (!unlocked || side !== "front" || !layout) return;
  const media = e.target.closest("[data-media]"); if (!media) return;
  const fig = e.target.closest("figure.fig"), i = +fig.dataset.i, sh = layout.sheets[i];
  if (editMode === "add") {
    const p = svgPt(fig.querySelector("svg"), e);
    const pts = ensureOverride(sh), m = mk(snap(p.x), snap(p.y));
    pts.push(m); selMark = { sig:sh.sig, id:m.id };
  } else selMark = null;
  afterEdit(i);
});
document.addEventListener("keydown", e => {
  if (!unlocked || !selMark || side !== "front" || !layout) return;
  if (e.target.closest("input, select, textarea")) return;
  const i = layout.sheets.findIndex(sh => sh.sig === selMark.sig); if (i < 0) return;
  const sh = layout.sheets[i], pts = ensureOverride(sh), m = pts.find(p => p.id === selMark.id);
  if (!m) return;
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); removeMark(sh, m.id); afterEdit(i); return; }
  if (e.key === "Escape") { selMark = null; afterEdit(i); return; }
  const dirs = { ArrowLeft:[-1, 0], ArrowRight:[1, 0], ArrowUp:[0, -1], ArrowDown:[0, 1] };
  if (dirs[e.key]) {
    e.preventDefault();
    const [dx, dy] = dirs[e.key];
    if (m.dirOf) placeDir(pts, m, dx, dy);
    else { const st = e.shiftKey ? 1 : 0.125; moveMark(pts, m, m.x + dx * st, m.y + dy * st); }
    afterEdit(i);
  }
});
function setSelFromInputs(){
  const sel = selectedMark(); if (!sel || sel.m.dirOf) return;
  const x = num($("#selX").value, NaN), y = num($("#selY").value, NaN);
  if (!isFinite(x) || !isFinite(y)) return;
  const i = layout.sheets.indexOf(sel.sh), pts = ensureOverride(sel.sh), m = pts.find(p => p.id === sel.m.id);
  if (!m) return;
  moveMark(pts, m, x, y); afterEdit(i);
}
$("#selX").addEventListener("change", setSelFromInputs);
$("#selY").addEventListener("change", setSelFromInputs);
$("#selDir").onclick = () => {
  const sel = selectedMark(); if (!sel || sel.m.dirOf) return;
  const i = layout.sheets.indexOf(sel.sh), pts = ensureOverride(sel.sh), m = pts.find(p => p.id === sel.m.id), D = state.dirSpacing;
  if (!m) return;
  const d = mk(m.x + D, m.y, m.id);
  for (const [dx, dy] of [[D, 0], [-D, 0], [0, -D], [0, D]]) {
    d.x = m.x + dx; d.y = m.y + dy;
    if (!markIssues(sel.sh, [d]).size) break;
  }
  pts.push(d); selMark = { sig:sel.sh.sig, id:d.id }; afterEdit(i);
};
$("#selDel").onclick = () => { const sel = selectedMark(); if (!sel) return; const i = layout.sheets.indexOf(sel.sh); removeMark(sel.sh, sel.m.id); afterEdit(i); };
$("#toolSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; editMode = b.dataset.tool; renderLayout(); renderMatbar(); });
function toggleLock(){
  unlocked = !unlocked;
  if (!unlocked) selMark = null; else { editMode = "move"; if (side === "back") side = "front"; }
  renderLayout(); renderMatbar();
}
$("#lockBtn").onclick = toggleLock;
$("#lockSide").onclick = () => { toggleLock(); if (unlocked) { $("#mat").scrollIntoView({ behavior:"smooth", block:"start" }); toast("Marks unlocked. Use Move, Add dots or Remove dots above the preview."); } };
$("#resetMarks").onclick = () => { if (layout) layout.sheets.forEach(sh => overrides.delete(sh.sig)); selMark = null; renderLayout(); renderWarnings(); renderMatbar(); toast("Marks are back to automatic."); };
$("#sideSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; side = b.dataset.side; selMark = null; renderLayout(); renderMatbar(); });

/* ================= export ================= */
let downloads = null;
(async () => { try { if (window.claude && window.claude.use) downloads = await window.claude.use("downloads"); } catch (e) {} })();
async function saveFile(name, blob){
  if (downloads) {
    try { await downloads.save({ filename:name, data:blob }); toast(`Saved ${name}`); return; }
    catch (e) {
      if (e && e.code === "declined") return;
      if (e && e.code === "too_large") { toast("That file is too large to save here. Try fewer sheets per export."); return; }
      if (e && e.code === "rate_limited") { toast("A save prompt is already open."); return; }
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
const slug = () => (state.jobName || "layout").trim().replace(/[^\w\-]+/g, "-").replace(/^-+|-+$/g, "") || "layout";

async function buildPdf(indices, mode){
  const { PDFDocument, PDFName, PDFNumber, PDFOperator, StandardFonts, degrees, cmyk } = PDFLib;
  const doc = await PDFDocument.create();
  const ctx = doc.context;
  const spot = (state.spotName || "CutContour").trim() || "CutContour";
  const sepFn = ctx.obj({ FunctionType:2, Domain:[0, 1], C0:[0, 0, 0, 0], C1:[0, 1, 0, 0], N:1 });
  const sepRef = ctx.register(ctx.obj([PDFName.of("Separation"), PDFName.of(spot), PDFName.of("DeviceCMYK"), sepFn]));
  const gsRef = ctx.register(ctx.obj({ Type:"ExtGState", OP:true, op:true, OPM:1 }));
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const P = 72, black = cmyk(0, 0, 0, 1);
  const op = (name, ...args) => PDFOperator.of(name, args.map(a => typeof a === "number" ? PDFNumber.of(+a.toFixed(4)) : (typeof a === "string" && a[0] === "/") ? PDFName.of(a.slice(1)) : a));
  // cut-only files carry two PDF layers, "Cut" (cut paths) above "Mark" (registration marks and label)
  let ocCut = null, ocMark = null;
  if (mode === "cut") {
    const S = PDFLib.PDFString;
    ocCut = ctx.register(ctx.obj({ Type:"OCG", Name:S.of("Cut") }));
    ocMark = ctx.register(ctx.obj({ Type:"OCG", Name:S.of("Mark") }));
    doc.catalog.set(PDFName.of("OCProperties"), ctx.obj({ OCGs:[ocCut, ocMark], D:{ Name:S.of("Layers"), Order:[ocCut, ocMark], ON:[ocCut, ocMark] } }));
  }
  const layerOn = (page, name) => { if (ocCut) page.pushOperators(PDFOperator.of("BDC", [PDFName.of("OC"), PDFName.of(name)])); };
  const layerOff = page => { if (ocCut) page.pushOperators(PDFOperator.of("EMC", [])); };
  const cache = new Map();
  const cutFallback = new Set();
  const getEmb = async (key, a, j) => {
    if (cache.has(key)) return cache.get(key);
    let e;
    if (a.type === "pdf") {
      const bytes = a.fileCut && a.fileCut.length ? await pdfWithRenamedCut(a) : a.pdfBytes;
      const [pg] = await doc.embedPdf(bytes, [a.pageIndex]); e = { kind:"page", obj:pg };
    }
    else if (a.type === "svg") {
      const ppi = Math.min(300, 8000 / Math.max(j.w, j.h));
      const c = await svgToCanvas(a.svgSrc, j.w, j.h, ppi);
      e = { kind:"img", obj: await doc.embedPng(new Uint8Array(await (await canvasBlob(c)).arrayBuffer())) };
    } else e = { kind:"img", obj: a.imgKind === "jpg" ? await doc.embedJpg(a.imgBytes) : await doc.embedPng(a.imgBytes) };
    cache.set(key, e); return e;
  };
  const drawArt = (page, e, a, box, rotCW, tw, th, Ht) => {
    const X = box.x * P, Y = (Ht - box.y - box.h) * P;
    let A = tw * P, B = th * P, t = (360 - rotCW) % 360;
    if (e.kind === "page") { const pr = a.pageRot || 0; if (pr % 180 === 90) { A = th * P; B = tw * P; } t = ((360 - pr) % 360 + t) % 360; }
    const o = t === 0 ? [X, Y] : t === 90 ? [X + B, Y] : t === 180 ? [X + A, Y + B] : [X, Y + A];
    const opts = { x:o[0], y:o[1], width:A, height:B, rotate:degrees(t) };
    if (e.kind === "page") page.drawPage(e.obj, opts); else page.drawImage(e.obj, opts);
  };
  const drawQR = (page, qr, name, Ht) => {
    const q = qrRuns(name);
    if (q) {
      const md = qr.s / q.n, ops = [op("q"), op("k", 0, 0, 0, 1)];
      for (const [r, c, l] of q.runs) ops.push(op("re", (qr.qx + c * md) * P, (Ht - qr.qy - (r + 1) * md) * P, l * md * P, md * P));
      ops.push(op("f"), op("Q"));
      page.pushOperators(...ops);
    }
    const sz = Math.min(9, (qr.s * P * 0.98) / font.widthOfTextAtSize(name, 1));
    const tw = font.widthOfTextAtSize(name, sz);
    page.drawText(name, { x:(qr.qx + qr.s / 2) * P - tw / 2, y:(Ht - qr.qy - qr.s) * P - sz - 3, size:sz, font, color:black });
  };
  const drawMarks = (page, pts, Ht) => {
    const sz = state.markSize * P;
    for (const p of pts) {
      if (state.markShape === "square") page.drawRectangle({ x:p.x * P - sz / 2, y:(Ht - p.y) * P - sz / 2, width:sz, height:sz, color:black });
      else page.drawCircle({ x:p.x * P, y:(Ht - p.y) * P, size:sz / 2, color:black });
    }
  };
  const drawXY = (page, sh, Ht, back) => {
    for (const r0 of xyMarks(sh)) { const r = back ? backBox(sh, r0) : r0; page.drawRectangle({ x:r.x * P, y:(Ht - r.y - r.h) * P, width:r.w * P, height:r.h * P, color:black }); }
  };
  const total = layout.sheets.length, m = isXY() ? 0 : state.margin, date = new Date().toLocaleDateString();
  const single = indices.length === 1 && layout.sheets[indices[0]].qr;
  doc.setTitle(single ? layout.sheets[indices[0]].name + (mode === "back" ? "_BACK" : mode === "cut" ? "_CUT" : "_FRONT") : (state.jobName || "Nested layout"));
  doc.setCreator("Nesting & production layout");
  for (const si of indices) {
    const sh = layout.sheets[si], Ht = sh.mediaH;
    const page = doc.addPage([sh.mediaW * P, sh.mediaH * P]);
    const res = page.node.normalizedEntries().Resources;
    let csd = res.lookup(PDFName.of("ColorSpace")); if (!csd) { csd = ctx.obj({}); res.set(PDFName.of("ColorSpace"), csd); }
    csd.set(PDFName.of("CutCS"), sepRef);
    let egs = res.lookup(PDFName.of("ExtGState")); if (!egs) { egs = ctx.obj({}); res.set(PDFName.of("ExtGState"), egs); }
    egs.set(PDFName.of("GSop"), gsRef);
    if (ocCut) {
      let pr = res.lookup(PDFName.of("Properties")); if (!pr) { pr = ctx.obj({}); res.set(PDFName.of("Properties"), pr); }
      pr.set(PDFName.of("OCCut"), ocCut); pr.set(PDFName.of("OCMark"), ocMark);
    }
    const pts = marksOn() ? marksFor(sh) : [];

    if (mode === "front") {
      for (const it of sh.items) {
        const j = it.job; let e;
        try { e = await getEmb(j.id, j, j); } catch (err) { throw new Error(`${j.name}: ${err.message || err}`); }
        drawArt(page, e, j, artBox(it), it.rot ? 90 : 0, j.w, j.h, Ht);
        const flaps = bannerFlaps(it);
        if (flaps.length) {
          let eb;
          try { eb = await getEmb(j.id + "-b", j.back, j); } catch (err) { throw new Error(`${j.name} back: ${err.message || err}`); }
          for (const f of flaps) {
            page.pushOperators(op("q"), op("re", f.clip.x * P, (Ht - f.clip.y - f.clip.h) * P, f.clip.w * P, f.clip.h * P), op("W"), op("n"));
            drawArt(page, eb, j.back, f.box, f.rot, j.w, j.h, Ht);
            page.pushOperators(op("Q"));
          }
        }
      }
      if (state.cropMarks || (isBanner() && state.bannerCrop)) for (const it of sh.items) for (const [x1, y1, x2, y2] of cropSegs(it))
        page.drawLine({ start:{ x:x1 * P, y:(Ht - y1) * P }, end:{ x:x2 * P, y:(Ht - y2) * P }, thickness:0.25, color:black });
      if (isBanner()) for (const it of sh.items) {
        const bm = bannerMarks(it);
        for (const [x1, y1, x2, y2] of bm.lines) page.drawLine({ start:{ x:x1 * P, y:(Ht - y1) * P }, end:{ x:x2 * P, y:(Ht - y2) * P }, thickness:0.5, color:black });
        for (const [x, y] of bm.gromm) {
          page.drawCircle({ x:x * P, y:(Ht - y) * P, size:0.15 * P, borderColor:black, borderWidth:0.5 });
          page.drawLine({ start:{ x:(x - 0.2) * P, y:(Ht - y) * P }, end:{ x:(x + 0.2) * P, y:(Ht - y) * P }, thickness:0.35, color:black });
          page.drawLine({ start:{ x:x * P, y:(Ht - y - 0.2) * P }, end:{ x:x * P, y:(Ht - y + 0.2) * P }, thickness:0.35, color:black });
        }
      }
      if (sh.qr) drawQR(page, sh.qr, sh.name + "_FRONT", Ht);
      drawMarks(page, pts, Ht);
      drawXY(page, sh, Ht, false);
    } else if (mode === "cut") {
      layerOn(page, "OCCut");
      for (const it of sh.items) {
        const j = it.job;
        if (j.type !== "pdf" || !(j.fileCut && j.fileCut.length)) continue;
        if (!cache.has(j.id + "-cut")) {
          let bytes = null;
          try { bytes = await pdfCutOnly(j); } catch (err) { console.warn(err); }
          if (!bytes) { cache.set(j.id + "-cut", null); cutFallback.add(j.id); toast(`Couldn't pull the cut line out of ${j.name}; the cut file uses a rectangle for it.`); }
          else { const [pg] = await doc.embedPdf(bytes, [j.pageIndex]); cache.set(j.id + "-cut", { kind:"page", obj:pg }); }
        }
        const e = cache.get(j.id + "-cut");
        if (e) drawArt(page, e, j, artBox(it), it.rot ? 90 : 0, j.w, j.h, Ht);
      }
      layerOff(page);
      layerOn(page, "OCMark");
      drawMarks(page, pts, Ht);
      drawXY(page, sh, Ht, false);
      layerOff(page);
    } else {
      for (const it of sh.items) {
        const j = it.job;
        if (!j.ds || !j.back) continue;
        let e;
        try { e = await getEmb(j.id + "-b", j.back, j); } catch (err) { throw new Error(`${j.name} back: ${err.message || err}`); }
        drawArt(page, e, j.back, backBox(sh, artBox(it)), backRot(it), j.w, j.h, Ht);
      }
      if (state.backMarks) {
        if (sh.qr) drawQR(page, backQR(sh), sh.name + "_BACK", Ht);
        drawMarks(page, pts.map(p => backPt(sh, p)), Ht);
        drawXY(page, sh, Ht, true);
      }
    }
    if (mode === "cut") layerOn(page, "OCMark");
    if (state.label && isXY() && sh.xy) {

async function buildAiCut(si, geoCache){

    "%AI5_FileFormat 4.0", "%AI3_ColorUsage: Color", `%AI5_ArtSize: ${n(W)} ${n(H)}`, "%AI5_RulerUnits: 0",

async function exportPdf(cutOnly){
  if (!layout || !layout.sheets.length) { toast("Add jobs first. Nothing is laid out yet."); return; }
  if (!window.PDFLib) { toast("The PDF writer didn't load. Check your connection and reload."); return; }
  const missing = jobs.filter(j => j.ds && !j.back);
  if (!cutOnly && missing.length) toast(`Heads up: ${missing.map(j => j.name).join(", ")} has no back file, so its back prints blank.`);
  const btn = cutOnly ? $("#btnCut") : $("#btnPdf"); const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Building…";
  try {
    const all = layout.sheets.map((_, i) => i), files = [];
    const perPage = true; // always one PDF per sheet, zipped when there's more than one
    const aiGeo = new Map();
    if (perPage) {
      for (const i of all) {
        const sh = layout.sheets[i];
        btn.textContent = `Building ${i + 1} of ${all.length}…`;
        files.push([`${sh.name}${cutOnly ? "_CUT" : "_FRONT"}.pdf`, await buildPdf([i], cutOnly ? "cut" : "front")]);
        if (cutOnly) files.push([`${sh.name}_CUT.ai`, await buildAiCut(i, aiGeo)]);
        if (!cutOnly && sh.ds) files.push([`${sh.name}_BACK.pdf`, await buildPdf([i], "back")]);
      }
    } else {
      files.push([`${slug()}-${cutOnly ? "cut" : "print-cut"}.pdf`, await buildPdf(all, cutOnly ? "cut" : "front")]);
      const dsIdx = all.filter(i => layout.sheets[i].ds);
      if (!cutOnly && dsIdx.length) files.push([`${slug()}-back.pdf`, await buildPdf(dsIdx, "back")]);
    }
    if (files.length === 1) await saveFile(files[0][0], new Blob([files[0][1]], { type:"application/pdf" }));
    else {
      if (!window.JSZip) throw new Error("the ZIP packer didn't load; check your connection and reload");
      const zip = new JSZip();
      for (const [n, b] of files) zip.file(n, b);
      const blob = await zip.generateAsync({ type:"blob" });
      const s = nameSlug();
      await saveFile(perPage ? `${zipName()}${cutOnly ? "_CUT" : ""}.zip` : `${slug()}${cutOnly ? "-cut" : ""}.zip`, blob);
    }
    try { btn.textContent = "Saving to history…"; await recordHistory(cutOnly ? files : null, aiGeo); } catch (e) { console.warn("history not saved", e); }
  } catch (err) {
    console.error(err);
    toast(`Export failed: ${err.message || err}`);
  } finally { btn.disabled = false; btn.textContent = label; }
}

/* ================= batch history (cut files + sheet screenshots, kept in this browser) ================= */
function histDb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open("batchlab-history", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("batches", { keyPath:"id" });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function histTx(mode, fn){
  const db = await histDb();
  return new Promise((res, rej) => {
    const tx = db.transaction("batches", mode), st = tx.objectStore("batches");
    let out; const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
    tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error);
  });
}
const histAll = async () => ((await histTx("readonly", st => st.getAll())) || []).sort((a, b) => b.t - a.t);
const histPut = e => histTx("readwrite", st => st.put(e));
const histDel = id => histTx("readwrite", st => st.delete(id));

    const j = it.job, img = await imgFor(j.thumb), b = artBox(it);
    if (img) { g.save(); g.translate((b.x + b.w / 2) * s, (b.y + b.h / 2) * s); g.rotate((it.rot ? 90 : 0) * Math.PI / 180); g.drawImage(img, -j.w * s / 2, -j.h * s / 2, j.w * s, j.h * s); g.restore(); }
    const t = cutRect(it); g.strokeStyle = "#E4007C"; g.lineWidth = 1.5; g.strokeRect(t.x * s, t.y * s, t.w * s, t.h * s);
  }
  g.fillStyle = "#000";
  for (const p of (marksOn() ? marksFor(sh) : [])) { g.beginPath(); g.arc(p.x * s, p.y * s, Math.max(2.5, state.markSize / 2 * s), 0, Math.PI * 2); g.fill(); }

async function recordHistory(cutFiles, aiGeo){
  if (!window.indexedDB || !layout || !layout.sheets.length) return;
  let files = cutFiles;
  if (!files) {
    files = [];
    for (let i = 0; i < layout.sheets.length; i++) {
      const sh = layout.sheets[i];
      files.push([`${sh.name}_CUT.pdf`, await buildPdf([i], "cut")]);
      files.push([`${sh.name}_CUT.ai`, await buildAiCut(i, aiGeo || new Map())]);

async function openHistory(){

  if (!layout || !layout.sheets.length) { toast("Add jobs first. Nothing is laid out yet."); return; }
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const rows = [["Unit", "File name", "Material", "Media (in)", "Job", "Width (in)", "Height (in)", "Pieces", "Rotated", "Cut line", "Double-sided", "Back file"]];
  layout.sheets.forEach((sh, i) => {
    const by = new Map();
    for (const it of sh.items) { const r = by.get(it.job) || { n:0, rot:0 }; r.n++; if (it.rot) r.rot++; by.set(it.job, r); }
    for (const [j, r] of by) rows.push([`${layout.roll ? "Panel" : "Sheet"} ${i + 1}`, sh.name + "_FRONT", matName(), `${fmt(sh.mediaW, 2)} x ${fmt(sh.mediaH, 2)}`, j.name, fmt(j.w), fmt(j.h), r.n, r.rot, j.cut ? "yes" : "no", j.ds ? "yes" : "no", j.back ? j.back.name : ""]);
  });
  for (const j of layout.over) rows.push(["Not placed", "", "", "", j.name, fmt(j.w), fmt(j.h), "", "", "too large", "", ""]);
  saveFile(`${slug()}-layout.csv`, new Blob([rows.map(r => r.map(q).join(",")).join("\n")], { type:"text/csv" }));
}

  sel.value = opt ? opt.value : "custom";
  $("#rollW").value = fmt(state.rollW); $("#rollMax").value = fmt(state.rollMax);
  const rsel = $("#rollPreset"); rsel.value = [...rsel.options].some(o => o.value === String(state.rollW)) ? String(state.rollW) : "custom";
  for (const k of ["bleed", "margin", "gap", "imgPpi", "markSize", "markQty", "markDist", "qrSize", "markEdge", "markSpacing", "dirSpacing", "backNudgeX", "backNudgeY"]) $("#" + k).value = fmt(state[k]);
  $("#orderNo").value = state.orderNo || "";
  for (const k of ["rotate", "qr", "cropMarks", "label", "balance", "dsSeparate", "backMarks", "consistent", "renameFileCut"]) $("#" + k).checked = !!state[k];
  for (const k of ["cutter", "markShape", "dirCorner", "qrCorner", "markMode", "flip"]) $("#" + k).value = state[k];
  $("#spotName").value = state.spotName; $("#spotEcho").textContent = state.spotName || "CutContour";
  $("#markFields").hidden = !marksOn(); $("#qrFields").hidden = !state.qr;
  $("#dotDefaults").hidden = !marksOn();
  $("#xyFields").hidden = !isXY();
  for (const k of ["xyMarkW", "xyTabW", "xyTabL", "xyMarkOff", "xyEdge", "xyLead"]) $("#" + k).value = fmt(state[k]);
  $("#freeFields").hidden = $("#freeDefaults").hidden = state.markMode === "frame";
  $("#namePreview").textContent = fileName(0) + "_FRONT.pdf";

const MATERIALS = { foam:"Foam board", coroplast:"Coroplast", pvc:"PVC", dibond:"Dibond", pulpboard:"Pulpboard", gatorboard:"Gatorboard", acrylic:"Acrylic", eflute:"E-flute" };
const THICKNESSES = {
  foam:['3/16"', '1/2"'], pvc:['1/8"', '1/4"', '1/2"', '1"'], coroplast:['4mm', '6mm'], dibond:['1/8"'], pulpboard:['60pt'],
  gatorboard:['3/16"', '1/2"', '1"'], eflute:['1.5mm'], acrylic:['1/8"', '1/4"', '1/2"', '1"'],
  other:['1/8"', '3/16"', '1/4"', '1/2"', '1"', '4mm', '6mm'], "":['1/8"', '3/16"', '1/4"', '1/2"', '1"', '4mm', '6mm']
};
function syncThickness(){
  const list = THICKNESSES[state.material] || THICKNESSES[""], sel = $("#thickness");
  if (state.thickness && !list.includes(state.thickness)) state.thickness = "";
  if (!state.thickness && list.length === 1 && state.material) state.thickness = list[0];
  sel.innerHTML = `<option value="">Thickness</option>` + list.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
  sel.value = state.thickness || "";
}
function matName(){
  if (isBanner()) return BANNER_MATS[state.bannerMat] || "";
  if (state.mode !== "sheet") return "";
  const m = state.material === "other" ? (state.materialOther || "").trim() : (MATERIALS[state.material] || "");
  return [state.thickness || "", m].filter(Boolean).join(" ");
}
function renderSums(){
  const pk = { none:"", top:"pocket top", bottom:"pocket bottom", tb:"pockets top & bottom", left:"pocket left", right:"pocket right", lr:"pockets left & right" }[state.bannerPockets];
  $("#sumBanner").textContent = [state.bannerHemOn ? 'hem 1"' : "no hem", pk, state.bannerGrom === "none" ? "no grommets" : state.bannerGrom === "corners" ? "grommets at corners" : `grommets every ${fmt(state.bannerGrom === "custom" ? state.bannerGromEvery : +state.bannerGrom)}"`].filter(Boolean).join(", ");
  $("#defSum").textContent = marksOn() ? `${state.markShape === "square" ? "Square" : "Dot"} ${fmt(state.markSize)}, ${fmt(state.markDist)} from art, ${state.dirCorner.toUpperCase()} ${fmt(state.dirSpacing)} apart` : "";
  const cut = { colex:"Colex", summa:"Summa", ruk:"RUK", other:"Other", none:"No marks", saga:"SAGA XY" }[state.cutter];
  $("#sumMedia").textContent = (matName() ? matName() + ", " : "") + (state.mode === "sheet" ? `${fmt(state.sheetW)} × ${fmt(state.sheetH)}` : `${fmt(rollWidth())} in ${isBanner() ? "banner " : ""}roll`) + `, margin ${fmt(state.margin)}, gap ${fmt(state.gap)}`;
  const bl = state.bleed > EPS ? `, bleed ${fmt(state.bleed)}` : "";
  $("#sumCutter").textContent = (isXY() ? `SAGA XY, ${fmt(state.xyMarkW)} in lines` : marksOn() ? `${cut}, ${fmt(state.markQty)} ${state.markShape === "square" ? "squares" : "dots"}, ${{ auto:"auto", frame:"around art", free:"empty spaces" }[state.markMode]}` : cut) + bl;
  $("#sumQR").textContent = state.qr ? `${fmt(state.qrSize)} in, ${state.qrCorner.toUpperCase()}` : "Off";
  $("#sumDS").textContent = `Flip ${state.flip === "v" ? "vertical" : "horizontal"}${state.dsSeparate ? ", own sheets" : ""}`;
  $("#sumOut").textContent = [state.jobName, state.orderNo].filter(Boolean).join(", ") || "No order #";
}

for (const k of ["rotate", "cropMarks", "label", "balance", "dsSeparate", "backMarks", "consistent", "renameFileCut"]) $("#" + k).addEventListener("change", e => { state[k] = e.target.checked; if (k === "rotate") renderJobs(); changed(); });

// collapsible sections remember their state
let openSecs = {};
try { openSecs = JSON.parse(localStorage.getItem("nest-tool-open") || "{}"); } catch (e) {}
document.querySelectorAll("details.sec[data-k]").forEach(d => {

// (i) tooltips
const tipEl = $("#tip");
function showTip(el){
  tipEl.textContent = el.dataset.tip; tipEl.hidden = false;
  const r = el.getBoundingClientRect(), tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  let x = Math.min(Math.max(8, r.left + r.width / 2 - tw / 2), window.innerWidth - tw - 8);
  let y = r.bottom + 6; if (y + th > window.innerHeight - 8) y = r.top - th - 6;
  tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
}
document.addEventListener("mouseover", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t); });
document.addEventListener("mouseout", e => { if (e.target.closest("[data-tip]")) tipEl.hidden = true; });
document.addEventListener("focusin", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t); });
document.addEventListener("focusout", e => { if (e.target.closest("[data-tip]")) tipEl.hidden = true; });
document.addEventListener("click", e => { if (e.target.closest(".info")) { e.preventDefault(); e.stopPropagation(); } }, true);
document.querySelector(".side").addEventListener("scroll", () => { tipEl.hidden = true; });

// quantity from the file name: "...-X4-Front.pdf" means 4 copies (last -X<number> wins)
function qtyFromName(name){
  const m = [...String(name).replace(/\.[^.]+$/, "").matchAll(/(?:^|[-_ ])X(\d{1,4})(?=[-_ ]|$)/gi)];
  if (!m.length) return 0;
  const n = parseInt(m[m.length - 1][1], 10);
  return n > 0 ? n : 0;
}
$("#appVer").textContent = "v" + APP_VERSION;
($("#btnDiag") || {}).onclick = async () => {
  const skip = new Set(["profiles"]);
  const st = {}; for (const k of Object.keys(state)) if (!skip.has(k)) st[k] = state[k];
  const info = {
    v: APP_VERSION, state: st,
    jobs: jobs.map(j => [j.name.slice(-24), +j.w.toFixed(4), +j.h.toFixed(4), j.qty, j.rotate ? 1 : 0, j.cut ? 1 : 0, j.ds ? 1 : 0, j.type, j.pageRot || 0]),
    layout: layout ? { mode:layout.mode, strips:!!layout.strips, sheets:layout.sheets.map(s => ({ p:s.pattern || 0, n:s.items.length, qr:s.qr ? [+s.qr.x.toFixed(2), +s.qr.y.toFixed(2)] : 0,
      it:s.items.map(i => [+i.x.toFixed(2), +i.y.toFixed(2), i.rot ? 1 : 0]) })) } : null
  };
  const text = "NESTING-SETUP " + JSON.stringify(info);
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
  if (ok) { toast("Setup copied. Paste it into the chat."); return; }
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;inset:10% 15%;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 40px rgba(0,0,0,.4)";
  box.innerHTML = `<b>Copy this text and paste it into the chat</b><textarea readonly style="flex:1;font:12px monospace;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px"></textarea><button class="btn" style="align-self:flex-end">Close</button>`;
  box.querySelector("textarea").value = text;
  box.querySelector("button").onclick = () => box.remove();
  document.body.appendChild(box);
  box.querySelector("textarea").select();
};
($("#btnRefresh") || {}).onclick = () => {
  if (!jobs.length) { toast("Add jobs first."); return; }
  selMark = null; update();
  toast(`Layout refreshed (v${APP_VERSION}).`);
};

let dragDepth = 0;
window.addEventListener("dragenter", e => { if ([...(e.dataTransfer?.types || [])].includes("Files")) { dragDepth++; $("#mat").classList.add("drag"); } });
window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("#mat").classList.remove("drag"); });
window.addEventListener("dragover", e => e.preventDefault());

let rT; window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(renderLayout, 120); });

syncSettingsUI();
renderJobs();
update();
